spring:
  application:
    name: kodirental
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

logging:
  level:
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000